[workspace]
default-members = ["time"]
members = ["time", "time-core", "time-macros"]
resolver = "3"

[workspace.package]
authors = ["Jacob Pratt <open-source@jhpratt.dev>", "Time contributors"]
edition = "2024"
rust-version = "1.88.0"
repository = "https://github.com/time-rs/time"
homepage = "https://time-rs.github.io"
keywords = ["date", "time", "calendar", "duration"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
time-core = { path = "time-core", version = "=0.1.9" }
time-macros = { path = "time-macros", version = "=0.2.32" }

criterion = { version = "0.8.1", default-features = false }
deranged = "0.5.8"
js-sys = "0.3.58"
libc = "0.2.98"
num-conv = "0.2.2"
num_threads = "0.1.2"
# no longer used for anything, but needed for back-compatibility
powerfmt = { version = "0.2.0", default-features = false }
quickcheck = { version = "1.0.3", default-features = false }
quickcheck_macros = "1.0.0"
rand08 = { package = "rand", version = "0.8.6", default-features = false }
rand09 = { package = "rand", version = "0.9.4", default-features = false }
rand010 = { package = "rand", version = "0.10.1", default-features = false }
rstest = { version = "0.26.1", default-features = false }
rstest_reuse = "0.7.0"
# ^1.0.184 due to serde-rs/serde#2538
serde = { version = "1.0.184", default-features = false }
serde_core = { version = "1.0.220", default-features = false }
serde_json = "1.0.68"
serde_test2 = "2.0.0"
trybuild = "1.0.102"

[profile.dev]
debug = 0

[profile.test]
debug = 2

# Deny-by-default lints: These are lints that indicate a lack of compiler guarantees, future
# incompatibility (with no guarantees in the meantime) introduce surprising behavior, or are likely
# to cause undesired behavior. Code that trigger these lints should only be allowed with a
# compelling reason that is clearly documented.

# Warn-by-default lints: These are lints that indicate possible errors, future incompatibility
# (with guaranteed behavior in the meantime), or other stylistic issues (including idioms). Code
# that trigger these lints should not cause undesired behavior and may be allowed as necessary.

# All overrides need higher priority. Any overrides that are for a specific crate need to be done
# the "traditional" way of using attributes at the crate root.

[workspace.lints.rust]
ambiguous_glob_reexports = "deny"
clashing_extern_declarations = "deny"
const_item_mutation = "deny"
dangling_pointers_from_temporaries = "deny"
deref_nullptr = "deny"
drop_bounds = "deny"
future_incompatible = { level = "deny", priority = -1 }
hidden_glob_reexports = "deny"
improper_ctypes = "deny"
improper_ctypes_definitions = "deny"
invalid_from_utf8 = "deny"
invalid_macro_export_arguments = "deny"
invalid_nan_comparisons = "deny"
invalid_reference_casting = "deny"
invalid_value = "deny"
named_arguments_used_positionally = "deny"
non_ascii_idents = "deny"
opaque_hidden_inferred_bound = "deny"
overlapping_range_endpoints = "deny"
suspicious_double_ref_op = "deny"
unconditional_recursion = "deny"
unexpected_cfgs = { level = "deny", check-cfg = [
    "cfg(__ui_tests)",
    "cfg(bench)",
] }
unnameable_test_items = "deny"
unsafe_op_in_unsafe_fn = "deny"
unstable_syntax_pre_expansion = "deny"

keyword_idents = { level = "warn", priority = -1 }
let_underscore = { level = "warn", priority = -1 }
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_abi = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
noop_method_call = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unused = { level = "warn", priority = -1 }
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

unstable_name_collisions = { level = "allow", priority = 1 } # overrides #![deny(future_incompatible)], temporary while `.cast_{un}signed()` is unstable

[workspace.lints.clippy]
alloc_instead_of_core = "deny"
std_instead_of_core = "deny"
undocumented_unsafe_blocks = "deny"

all = { level = "warn", priority = -1 }
as_underscore = "warn"
dbg_macro = "warn"
decimal_literal_representation = "warn"
explicit_auto_deref = "warn"
get_unwrap = "warn"
manual_let_else = "warn"
missing_docs_in_private_items = "warn"
missing_enforced_import_renames = "warn"
missing_panics_doc = "warn"
nursery = { level = "warn", priority = -1 }
obfuscated_if_else = "warn"
print_stdout = "warn"
semicolon_outside_block = "warn"
todo = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
use_debug = "warn"

option_if_let_else = { level = "allow", priority = 1 }     # suggests terrible code, overrides #![warn(clippy::nursery)]
redundant_pub_crate = { level = "allow", priority = 1 }    # rust-lang/rust-clippy#5369, overrides #![warn(clippy::nursery)]
uninhabited_references = { level = "allow", priority = 1 } # rust-lang/rust-clippy#11984
incompatible_msrv = { level = "allow", priority = 1 }      # rust-lang/rust-clippy#12280

[workspace.lints.rustdoc]
private_doc_tests = "warn"
unescaped_backticks = "warn"
